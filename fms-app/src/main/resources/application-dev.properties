spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/FMSapp}
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:123}

app.jwt.secret=${DEV_JWT_SECRET:dev-only-secret-please-change-me-32-bytes-minimum}
app.jwt.access-ttl=${DEV_JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${DEV_JWT_REFRESH_TTL:7d}

spring.security.oauth2.client.registration.google.client-id=${DEV_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${DEV_GOOGLE_CLIENT_SECRET}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2.client=DEBUG

app.startup-logger.enabled=${DEV_STARTUP_LOGGER_ENABLED:true}